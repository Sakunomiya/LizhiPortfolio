      const copy = {
        zh: {

        },
        en: {
          summary: 'This project-detail template will later present the concept, process, key content, images, videos and playable builds.',
          primary: 'Explore preview', secondary: 'Project design', featuresIndex: '01 / PROJECT PREVIEW', featuresTitle: 'Project preview', reviewIndex: '02 / PROJECT DESIGN', reviewTitle: 'Project design', featureTitles: ['Project visual', 'Concept & framing', 'Play / mechanics', 'Experience excerpt', 'Design material'], featureText: ['Replace this with a project image, poster or video cover.', 'The project context, audience and design question will be added here.', 'Key mechanics, narrative or interaction design will be presented here.', 'Experience excerpts and development screenshots will be placed here.', 'Design documents, sketches and test records will be placed here.'], processTitles: ['Design document', 'Development sketches', 'Demo showcase', 'Testing log', 'Design iteration'], processText: ['Rules, systems or content planning.', 'Sketches, flow diagrams and visual studies.', 'Prototypes, video or playable demos.', 'Testing process, feedback and adjustments.', 'Final design decisions and reflection.'], back: 'Back to guide ←', visual: 'PROJECT VISUAL', toggle: '中文'
        }
      };
      const exhibitionCopy = {
        zh: { title: '项目展览', captions: ['项目主视觉', '场景与氛围', '玩法片段', '设计素材', '补充展示'] },
        en: { title: 'Project exhibition', captions: ['Project visual', 'Environment & mood', 'Gameplay moment', 'Design material', 'Additional view'] }
      };
      const mediaCopy = {
        zh: { title: '项目媒体', video: '项目视频', game: '在线体验' },
        en: { title: 'Project media', video: 'Project video', game: 'Playable build' }
      };
      function safeMediaUrl(value) {
        if (typeof value !== 'string' || !value.trim()) return '';
        try {
          const url = new URL(value, location.href);
          return ['http:', 'https:'].includes(url.protocol) ? url.href : '';
        } catch { return ''; }
      }
      function renderMediaSlots() {
        const media = mediaCopy[language];
        const videoUrl = safeMediaUrl(project.videoUrl);
        const gameUrl = safeMediaUrl(project.gameUrl);
        const section = document.querySelector('#detail-media');
        const grid = document.querySelector('#detail-media-grid');
        const blocks = [];
        if (videoUrl) blocks.push(`<article class="detail-media-card"><h3>${media.video}</h3><video controls playsinline preload="metadata"${project.videoPoster ? ` poster="${safeMediaUrl(project.videoPoster)}"` : ''}><source src="${videoUrl}">您的浏览器不支持视频播放。</video></article>`);
        if (gameUrl) blocks.push(`<article class="detail-media-card detail-game-frame"><h3>${media.game}</h3><iframe src="${gameUrl}" title="${media.game}" loading="lazy" allow="fullscreen; autoplay" sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock allow-popups"></iframe></article>`);
        section.hidden = blocks.length === 0;
        if (blocks.length) {
          document.querySelector('#detail-media-title').textContent = media.title;
          grid.innerHTML = blocks.join('');
        } else grid.innerHTML = '';
        return { videoUrl, gameUrl };
      }
      function render() {
        const isEnglish = language === 'en';
        const t = copy[language];
        document.documentElement.lang = isEnglish ? 'en' : 'zh-CN';
        document.title = `${project[isEnglish ? 'en' : 'zh']} | Lizhi`;
        document.querySelector('#detail-kicker').textContent = `${String(id).padStart(2, '0')} / ${categories[category][isEnglish ? 'en' : 'zh']}`;
        document.querySelector('#detail-title').innerHTML = [...project[isEnglish ? 'en' : 'zh']].map((char, index) => `<span style="--char-index:${index}">${char === ' ' ? '&nbsp;' : char}</span>`).join('');
        document.querySelector('#detail-type').textContent = project[isEnglish ? 'enType' : 'zhType'];
        document.querySelector('#detail-summary').textContent = t.summary;
        const action = projectAction[category]?.[id];
        const actionLink = document.querySelector('#detail-play-link');
        actionLink.hidden = !action;
        if (action) actionLink.textContent = action[isEnglish ? 1 : 0];
        document.querySelector('#detail-secondary').textContent = t.secondary;
        document.querySelector('#detail-exhibition-link').textContent = isEnglish ? 'Project exhibition' : '项目展览';
        document.querySelector('#detail-review-title').textContent = t.reviewTitle;
        document.querySelector('#detail-back').textContent = t.back;
        document.querySelector('#detail-back').href = `index.html?return=${categories[category].anchor}#${categories[category].anchor}`;
        document.querySelector('#detail-language').textContent = t.toggle;
        const heroImage = project.heroImage || project.image;
        document.body.style.backgroundImage = '';
        const heroSection = document.querySelector('.detail-hero');
        heroSection.style.backgroundImage = '';
        const processItems = project.processItems || t.processTitles.map((_, index) => index);
        document.querySelector('#detail-visual-label').textContent = t.visual;
        document.querySelector('#detail-visual').style.backgroundImage = `linear-gradient(140deg, rgba(4, 6, 16, .12), rgba(4, 6, 16, .78)), url("${heroImage}")`;
        document.querySelector('#detail-process-gallery').innerHTML = processItems.map((contentIndex, index) => `<article class="detail-process-card" style="--process-index:${index};background-image:linear-gradient(180deg,rgba(10,12,24,.12),rgba(5,6,14,.92)),url('${project.image}')"><span>0${index + 1}</span><h3>${t.processTitles[contentIndex]}</h3><p>${t.processText[contentIndex]}</p></article>`).join('');
        const exhibition = exhibitionCopy[language];
        const exhibitionImages = (project.exhibitionImages || Array.from({ length: 5 }, () => project.image)).slice(0, 5);

        document.querySelector('#detail-exhibition-grid').innerHTML = exhibitionImages.map((image, index) => `<article class="detail-exhibition-card detail-exhibition-${index}" style="background-image:linear-gradient(180deg,rgba(6,8,18,.04) 24%,rgba(5,6,14,.88) 100%),url('${image}')"><h3>${exhibition.captions[index] || exhibition.captions[0]}</h3></article>`).join('');
        const mediaLinks = renderMediaSlots();
        if (action) actionLink.href = mediaLinks.gameUrl || mediaLinks.videoUrl || '#detail-exhibition';
      }
      document.querySelector('#detail-language').addEventListener('click', () => { language = language === 'zh' ? 'en' : 'zh'; render(); setupProcessGallery(); });
      document.querySelector('#detail-back').addEventListener('click', event => { event.preventDefault(); location.replace(event.currentTarget.href); });
      document.addEventListener('pointermove', event => {
        const button = event.target.closest('.detail-play-link');
        if (!button) return;
        const rect = button.getBoundingClientRect();
        button.style.setProperty('--specular-x', `${event.clientX - rect.left}px`);
        button.style.setProperty('--specular-y', `${event.clientY - rect.top}px`);
      });
      function startParticles() {
        const canvas = document.querySelector('.detail-particles');
        const ctx = canvas.getContext('2d');
        let width = 0, height = 0;
        const dots = Array.from({ length: 150 }, () => ({ x: 0, y: 0, r: 0, speed: 0 }));
        const resize = () => { width = canvas.width = innerWidth * devicePixelRatio; height = canvas.height = innerHeight * devicePixelRatio; canvas.style.width = `${innerWidth}px`; canvas.style.height = `${innerHeight}px`; ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); dots.forEach(dot => { dot.x = Math.random() * innerWidth; dot.y = Math.random() * innerHeight; dot.r = .6 + Math.random() * 1.8; dot.speed = .08 + Math.random() * .25; }); };
        const draw = () => { ctx.clearRect(0, 0, innerWidth, innerHeight); dots.forEach(dot => { dot.y -= dot.speed; if (dot.y < -4) { dot.y = innerHeight + 4; dot.x = Math.random() * innerWidth; } ctx.fillStyle = 'rgba(49, 81, 218, .38)'; ctx.beginPath(); ctx.arc(dot.x, dot.y, dot.r, 0, Math.PI * 2); ctx.fill(); }); requestAnimationFrame(draw); };
        addEventListener('resize', resize); resize(); draw();
      }
      function setupProcessGallery() {
        const gallery = document.querySelector('#detail-process-gallery');
        let active = Math.floor((gallery.children.length - 1) / 2);
        const arrange = () => [...gallery.children].forEach((card, index) => {
          const offset = index - active;
          card.style.transform = `translate(-50%, -50%) translateX(${offset * 62}%) rotate(${offset * 6}deg)`;
          card.style.opacity = Math.max(.18, 1 - Math.abs(offset) * .3);
          card.style.filter = `blur(${Math.min(3, Math.abs(offset) * 1.25)}px)`;
          card.style.zIndex = String(10 - Math.abs(offset));
        });
        const move = direction => { active = Math.max(0, Math.min(gallery.children.length - 1, active + direction)); arrange(); };
        let wheelLocked = false;
        gallery.addEventListener('wheel', event => {
          const bounds = gallery.getBoundingClientRect();
          const inMiddleZone = Math.abs(event.clientX - (bounds.left + bounds.width / 2)) <= Math.min(bounds.width * .31, 360)
            && Math.abs(event.clientY - (bounds.top + bounds.height / 2)) <= Math.min(bounds.height * .39, 210);
          if (!inMiddleZone || Math.abs(event.deltaY) <= 12) return;
          event.preventDefault();
          if (wheelLocked) return;
          move(event.deltaY > 0 ? 1 : -1);
          wheelLocked = true;
          setTimeout(() => { wheelLocked = false; }, 480);
        }, { passive: false });
        gallery.addEventListener('click', event => { const card = event.target.closest('.detail-process-card'); if (card) { active = [...gallery.children].indexOf(card); arrange(); } });
        arrange();
      }
      startParticles();
      render();
